name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: lint (syntax errors, undefined names)
        run: pip install ruff && ruff check --select E9,F63,F7,F82 .
      # No torch/trustmark install and no model or image downloads: only the recorded-results checks run.
      - name: check recorded results
        run: |
          python verify.py results/gate-results.json
          python summarize.py results/gate-results.json
